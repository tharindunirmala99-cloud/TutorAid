<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ============================================================
         SEO: Title tag — include primary keyword + brand + location
         Keep under 60 characters for Google to show it fully.
         ============================================================ -->
    <title>Cambridge & Edexcel Online Tutoring in Sri Lanka | TutorAid</title>

    <!-- ============================================================
         SEO: Meta description — this is what appears in Google results.
         Write for the parent, not for algorithms. Under 155 characters.
         FIX: was a keyword dump with no call to action.
         ============================================================ -->
    <meta name="description"
        content="Expert online tutors for Cambridge and Edexcel students in Sri Lanka. Structured tutor matching, free trial session available. Book today.">

    <!-- ============================================================
         SEO: Canonical URL — tells Google which URL is the "real" one.
         FIX: was missing entirely. Prevents duplicate-content penalties.
         ============================================================ -->
    <link rel="canonical" href="https://tutoraid.lk/">

    <!-- ============================================================
         SEO: Open Graph — controls how your link looks when shared
         on WhatsApp, Facebook, LinkedIn, etc.
         FIX: og:url was "https://yourdomain.com/" (template placeholder).
         FIX: og:image was an SVG — social platforms require JPG/PNG.
         FIX: og:image dimensions declared so platforms don't have to fetch.
         ============================================================ -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tutoraid.lk/">
    <meta property="og:title" content="Cambridge & Edexcel Online Tutoring in Sri Lanka | TutorAid">
    <meta property="og:description"
        content="Expert online tutors for Cambridge and Edexcel students in Sri Lanka. Structured tutor matching, free trial session available.">
    <!-- ACTION NEEDED: Create a 1200×630px JPG and upload it to /assets/ -->
    <meta property="og:image" content="https://tutoraid.lk/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="TutorAid — Cambridge and Edexcel tutoring in Sri Lanka">
    <meta property="og:locale" content="en_LK">
    <meta property="og:site_name" content="TutorAid">

    <!-- ============================================================
         SEO: Twitter Card — controls link previews on Twitter/X.
         FIX: was missing entirely.
         ============================================================ -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Cambridge & Edexcel Online Tutoring in Sri Lanka | TutorAid">
    <meta name="twitter:description"
        content="Expert online tutors for Cambridge and Edexcel students in Sri Lanka. Structured tutor matching, free trial available.">
    <meta name="twitter:image" content="https://tutoraid.lk/assets/og-image.jpg">

    <!-- ============================================================
         SEO: Structured data (JSON-LD) — tells Google exactly what
         your business is. Enables rich results in search (star ratings,
         phone number, opening hours directly in Google).
         FIX: was missing entirely.
         ============================================================ -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "TutorAid",
        "url": "https://tutoraid.lk",
        "logo": "https://tutoraid.lk/assets/logo.svg",
        "description": "Curated online tutoring for Cambridge and Edexcel students in Sri Lanka. Structured tutor matching for Mathematics, Sciences, and English.",
        "address": {
            "@type": "PostalAddress",
            "addressCountry": "LK"
        },
        "areaServed": {
            "@type": "Country",
            "name": "Sri Lanka"
        },
        "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "Tutoring Services",
            "itemListElement": [
                {
                    "@type": "Offer",
                    "itemOffered": {
                        "@type": "Course",
                        "name": "Cambridge IGCSE Tutoring",
                        "description": "One-on-one online tutoring for Cambridge IGCSE Mathematics, Sciences, and English"
                    }
                },
                {
                    "@type": "Offer",
                    "itemOffered": {
                        "@type": "Course",
                        "name": "Edexcel IGCSE Tutoring",
                        "description": "One-on-one online tutoring for Edexcel IGCSE subjects"
                    }
                }
            ]
        },
        "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "availableLanguage": ["English", "Sinhala"]
        }
    }
    </script>

    <!-- ============================================================
         SEO: Robots meta — explicitly allow indexing.
         FIX: was missing. Without this, some crawlers apply
         conservative defaults.
         ============================================================ -->
    <meta name="robots" content="index, follow">

    <!-- ============================================================
         NOTE: Remove the keywords meta tag entirely.
         Google has ignored it since 2009. It only helps competitors
         see your keyword strategy.
         ============================================================ -->

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <!-- ACTION NEEDED: Also add a PNG fallback for older browsers -->
    <link rel="icon" type="image/png" href="assets/favicon.png">

    <!-- Google Tag Manager -->
    <script>(function (w, d, s, l, i) {
            w[l] = w[l] || []; w[l].push({
                'gtm.start':
                    new Date().getTime(), event: 'gtm.js'
            }); var f = d.getElementsByTagName(s)[0],
                j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : ''; j.async = true; j.src =
                    'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f);
        })(window, document, 'script', 'dataLayer', 'GTM-WBFCX59N');</script>
    <!-- End Google Tag Manager -->

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Noto+Sans:wght@100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f5c400",
                        "secondary": "#1BAA4B",
                        "background-light": "#fcfbf8",
                        "background-dark": "#231f0f",
                        "surface-light": "#ffffff",
                        "surface-dark": "#2d2818",
                        "text-dark": "#1d190c",
                        "text-light": "#fcfbf8",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"]
                    }
                }
            }
        }
    </script>

    <script type="importmap">
    {
        "imports": {
            "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
        }
    }
    </script>
</head>

<body class="bg-background-light dark:bg-background-dark font-body text-text-dark dark:text-text-light antialiased">

    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WBFCX59N" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <!-- ============================================================
         SEO: noscript fallback content for Googlebot.
         Your site is a JS SPA (index.tsx). If Google can't execute JS,
         it sees a completely empty page. This gives it something to read.
         ACTION NEEDED: Update this text to match your actual homepage content.
         ============================================================ -->
    <noscript>
        <div style="max-width:800px;margin:2rem auto;padding:1rem;font-family:sans-serif">
            <h1>Cambridge &amp; Edexcel Online Tutoring in Sri Lanka | TutorAid</h1>
            <p>TutorAid offers expert, curated online tutoring for Cambridge and Edexcel students across Sri Lanka.
                We match students with verified tutors in Mathematics, Sciences, and English, with a structured
                onboarding process and a free trial session.</p>
            <h2>Subjects</h2>
            <ul>
                <li>Cambridge IGCSE Mathematics</li>
                <li>Cambridge IGCSE Sciences (Physics, Chemistry, Biology)</li>
                <li>Cambridge IGCSE English</li>
                <li>Edexcel IGCSE subjects</li>
            </ul>
            <p>Contact us via <a href="https://tutoraid.lk">tutoraid.lk</a> to book a free trial session.</p>
        </div>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
